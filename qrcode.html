<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Cool - 扫码进入游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --surface-0: #05070C;
      --surface-1: #0A0D12;
      --surface-2: #0F131C;
      --surface-3: #161D2B;
      --accent: #38BDF8;
      --text: #E5F1FF;
      --text-dim: #94A3B8;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--surface-0) 0%, var(--surface-2) 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
      display: grid;
      place-items: center;
      padding: clamp(1rem, 4vw, 2rem);
    }

    .container {
      max-width: 480px;
      width: 100%;
      background: var(--surface-1);
      border-radius: 24px;
      padding: clamp(2rem, 6vw, 3rem);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--accent) 0%, #6EE7B7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: clamp(0.875rem, 2.5vw, 1rem);
      color: var(--text-dim);
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .qr-wrapper {
      background: white;
      padding: 1.5rem;
      border-radius: 16px;
      display: inline-block;
      margin: 0 auto 2rem;
      display: block;
      width: fit-content;
    }

    #qrcode {
      display: block;
    }

    .link-section {
      background: var(--surface-2);
      padding: 1.25rem;
      border-radius: 12px;
      margin-top: 1.5rem;
    }

    .link-label {
      font-size: 0.875rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }

    .link-display {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .link-text {
      flex: 1;
      background: var(--surface-3);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      color: var(--accent);
      word-break: break-all;
      font-family: 'Monaco', 'Courier New', monospace;
    }

    .copy-btn {
      background: var(--accent);
      color: var(--surface-0);
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      font-size: 0.875rem;
    }

    .copy-btn:hover {
      background: #22A8E8;
      transform: translateY(-1px);
    }

    .copy-btn:active {
      transform: translateY(0);
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.8125rem;
      color: var(--text-dim);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Play Cool</h1>
    <p class="subtitle">扫描二维码或点击链接开始游戏</p>
    
    <div class="qr-wrapper">
      <div id="qrcode"></div>
    </div>

    <div class="link-section">
      <div class="link-label">游戏链接</div>
      <div class="link-display">
        <div class="link-text" id="gameLink">https://gqcoder.github.io/play_cool/</div>
        <button class="copy-btn" onclick="copyLink()">复制</button>
      </div>
    </div>

    <div class="footer">
      支持移动端和桌面端<br>
      推荐使用手机浏览器打开以获得最佳体验
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    const gameUrl = 'https://gqcoder.github.io/play_cool/'
    
    new QRCode(document.getElementById('qrcode'), {
      text: gameUrl,
      width: 200,
      height: 200,
      colorDark: '#0a0d12',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    })

    function copyLink() {
      const linkText = document.getElementById('gameLink').textContent
      navigator.clipboard.writeText(linkText).then(() => {
        const btn = event.target
        const originalText = btn.textContent
        btn.textContent = '已复制'
        setTimeout(() => {
          btn.textContent = originalText
        }, 2000)
      })
    }
  </script>
</body>
</html>
